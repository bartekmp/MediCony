[project]
name = "MediCony"
version = "2.4.29"
description = "A Python package for managing medical conditions and treatments in Medicover service."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pharmaradar @ https://github.com/bartekmp/pharmaradar/archive/refs/heads/main.tar.gz",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "notifiers==1.3.6",
    "python-dotenv==1.2.2",
    "fake-useragent==2.2.0",
    "pytz==2026.2",
    "tenacity==9.1.4",
    "numpy==2.5.1",
    "aiogram==3.29.1",
    "lxml>=5.0.0",
    "apscheduler==3.11.3",
    "cryptography==49.0.0",
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.12",
]
optional-dependencies = { dev = [
    "ruff>=0.9.0",
    "flake8==7.3.0",
    "isort==8.0.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "pytest-env==1.6.0",
    "python-semantic-release==10.6.0",
    "setuptools_scm==10.2.0",
] }

[project.scripts]
medicony = "medicony:main"

[build-system]
requires = ["setuptools>=61", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["medicony"]
include-package-data = true

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__",
]

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
addopts = "--ignore=feature_tests"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Field \"model_custom_emoji_id\" in UniqueGiftColors has conflict with protected namespace \"model_\":UserWarning",
]

[tool.pytest_env]
MEDICONY_INTERACTIVE = "true"

[tool.semantic_release]
branch = "main"
changelog_file = ""
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat", "feature"]
patch_tags = ["fix", "bugfix", "improvement", "enhancement", "update"]
allowed_tags = [
    "feat",
    "feature",
    "fix",
    "bugfix",
    "improvement",
    "enhancement",
    "update",
    "doc"
]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true
