name: Docker Image CI

on:
  pull_request:
  workflow_run:
    workflows: ["Release and Publish"]
    types:
      - completed
  workflow_dispatch:

env:
  IMAGE_NAME: medicony
  REGISTRY: ghcr.io

jobs:
  build-for-pr-verification:
    if: github.event_name == 'pull_request'
    permissions:
      packages: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Get version from latest tag
        id: get_version
        run: |
          git fetch --tags
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "SEMVER=$VERSION" >> $GITHUB_ENV
          echo "Calculated version: $VERSION"

      - name: Build the Docker image for PR verification
        run: docker build . --file Dockerfile --build-arg VERSION=${{ env.SEMVER }} --tag $IMAGE_NAME:$SEMVER --label "runnumber=${GITHUB_RUN_ID}" --label "pr=${GITHUB_HEAD_REF}"

  build-and-push-ghcr:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    permissions:
      packages: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Get version from latest tag
        id: get_version
        run: |
          git fetch --tags
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "SEMVER=$VERSION" >> $GITHUB_ENV
          echo "Calculated version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.SEMVER }}
          labels: |
            org.opencontainers.image.title=MediCony
            org.opencontainers.image.description=A Python package for managing medical conditions and treatments in Medicover service.
            org.opencontainers.image.version=${{ env.SEMVER }}
            feature.branch=main
            build.id=${{ github.run_id }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.SEMVER }}
